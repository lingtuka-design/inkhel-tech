<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iTECH — Best Smartphones, Gadgets & Tech Guides</title>
    <meta name="description" content="iTECH is an independent technology publication covering smartphones, audio gadgets, buying guides, deals, and tech insights for readers in Mizoram and beyond." />
    
    <!-- Google AdSense Account Verification & Script -->
    <meta name="google-adsense-account" content="ca-pub-2343866392435128" />
    <link rel="dns-prefetch" href="https://adservice.google.com" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2343866392435128" crossorigin="anonymous"></script>

    <!-- Inline Theme Initializer (prevents flash & defaults to light) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('inkhel_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tech.inkhel.com/" />
